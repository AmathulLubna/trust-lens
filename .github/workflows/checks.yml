name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck:tests
      - run: npm run typecheck:lcu
      - run: npm run build
        env:
          VITE_CONVEX_URL: https://example.convex.cloud
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy -r ml/voice_sentinel/requirements-local.txt
      - run: python -m unittest discover -s tl_model_lcu -p 'test_*.py' -v
