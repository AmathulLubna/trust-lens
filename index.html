<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta
    name="description"
    content="Trust Lens — deepfake voice detection and scam alerts for your team. Scan calls and voice notes for AI-generated speech, flag scam patterns in real time, and alert the right people before anyone acts."
  />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("tl-theme");
        var dark = t === "dark" || ((!t || t === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) { document.documentElement.classList.add("dark"); document.documentElement.style.colorScheme = "dark"; }
      } catch (e) {}
    })();
  </script>
  <title>Trust Lens — Deepfake Voice Detection</title>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
